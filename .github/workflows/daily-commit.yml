name: Daily Auto Commit

on:
  schedule:
    - cron: '0 4 * * *'   # Toshkent 09:00
    - cron: '0 8 * * *'   # Toshkent 13:00
    - cron: '0 12 * * *'  # Toshkent 17:00
    - cron: '0 16 * * *'  # Toshkent 21:00
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update log file
        run: |
          echo "Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC" >> activity.log

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add activity.log
          git commit -m "chore: daily update" || echo "Nothing to commit"
          git push
