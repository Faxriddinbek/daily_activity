name: Daily Auto Commit

on:
  schedule:
    - cron: '7 3 * * *'
    - cron: '7 6 * * *'
    - cron: '7 9 * * *'
    - cron: '7 12 * * *'
    - cron: '7 15 * * *'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update log file
        run: echo "Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC" >> activity.log

      - name: Commit and push
        run: |
          git config user.name "Faxriddinbek"
          git config user.email "12345678+Faxriddinbek@users.noreply.github.com"
          git add activity.log
          git commit -m "chore: daily update"
          git push
